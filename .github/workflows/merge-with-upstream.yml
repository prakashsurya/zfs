on: [push]

jobs:
  merge-with-upstream:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: prakashsurya/actions/merge-with-upstream@master
      with:
        upstream-repository: https://github.com/openzfs/zfs.git
        upstream-branch: master
        downstream-branch: 6.0/stage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
